<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>ChronoFoyer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#f6f7f9;--s:#fff;--s2:#f1f3f6;--t:#14181f;--m:#667085;--b:#e4e7ec;--p:#4f46e5;--pt:#fff;--d:#dc2626;--ok:#059669;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1116;--s:#171b22;--s2:#1f242d;--t:#eef0f4;--m:#9aa3b2;--b:#2a303b;--p:#818cf8;--pt:#0e1116;--d:#f87171;--ok:#34d399}}
:root[data-theme=dark]{--bg:#0e1116;--s:#171b22;--s2:#1f242d;--t:#eef0f4;--m:#9aa3b2;--b:#2a303b;--p:#818cf8;--pt:#0e1116;--d:#f87171;--ok:#34d399}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--s);z-index:40}
button,input,select,textarea{font:inherit;color:inherit}
.w{max-width:1120px;margin:0 auto;padding:0 16px}
.hd{background:var(--s);border-bottom:1px solid var(--b);position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding:10px 0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--p);color:var(--pt);display:grid;place-items:center;font-weight:800}
main{padding-top:20px;padding-bottom:40px;display:grid;gap:16px}
.card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:16px}
.card>h2,.card>h3{margin:0 0 12px;font-size:15px}
.btn{border:1px solid var(--b);background:var(--s);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;transition:background .15s}
.btn:hover{background:var(--s2)}.btn.p{background:var(--p);color:var(--pt);border-color:var(--p)}.btn.d{color:var(--d)}.btn.r{background:#dc2626;color:#fff;border-color:#dc2626}.btn.r:hover{background:#b91c1c}.btn.r .bd{background:#fff;color:#dc2626}.btn.g{border-color:transparent;background:none}
.in{border:1px solid var(--b);background:var(--s);border-radius:9px;padding:6px 8px;width:100%;min-width:0}.in[type=time]{width:auto}.in:disabled{opacity:.4}
.in:focus,.btn:focus-visible,.dbtn:focus-visible{outline:2px solid var(--p);outline-offset:1px}
.seg{display:inline-flex;background:var(--s2);border-radius:10px;padding:3px;gap:2px}.seg .btn{border:0;background:none;color:var(--m)}.seg .btn.on{background:var(--s);color:var(--t);box-shadow:0 1px 2px #0002}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.col{display:grid;gap:10px}.g2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.mu{color:var(--m)}.sm{font-size:12px}.mono{font-variant-numeric:tabular-nums}.sub{background:var(--s2);border-radius:10px;padding:10px}
.chip{font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--s2);border:1px solid var(--b)}
.ev{border-left:4px solid var(--h);background:color-mix(in srgb,var(--h) 9%,var(--s));border-radius:10px;padding:10px 12px}
.lay{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.days{display:grid;gap:4px}.dbtn{display:flex;justify-content:space-between;align-items:center;border:0;background:none;border-radius:10px;padding:9px 10px;cursor:pointer;font-weight:600}
.dbtn:hover{background:var(--s2)}.dbtn.on{background:var(--p);color:var(--pt)}.ds{display:none}.cnt{font-size:11px;opacity:.7}
.tw{overflow-x:auto}.week{display:grid;grid-template-columns:repeat(7,minmax(170px,1fr));gap:10px;min-width:1200px}.wd{background:var(--s2);border-radius:12px;padding:8px}.wd.td{outline:2px solid var(--p)}
.week .ev{padding:7px 9px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:11px;text-transform:uppercase;color:var(--m);text-align:left;padding:8px}td{padding:6px 8px;border-top:1px solid var(--b)}tr.off{opacity:.55}
.ph{color:#fff;padding:10px 16px;font-weight:700}
.bd{background:var(--p);color:var(--pt);border-radius:99px;font-size:11px;padding:0 6px;margin-left:6px}
.ov{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}.ov.r{justify-content:flex-end;padding:0}
.md{background:var(--s);border-radius:16px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto;display:grid;gap:12px;animation:in .2s}.dr{height:100%;max-height:none;border-radius:0;align-content:start}
.bnr,.tt{position:fixed;z-index:60;left:50%;transform:translateX(-50%);background:#14181f;color:#fff;border-radius:12px;padding:12px 16px;box-shadow:0 8px 30px #0005;max-width:92%}
.bnr{top:calc(12px + env(safe-area-inset-top,0px));width:420px}.tt{bottom:calc(84px + env(safe-area-inset-bottom,0px));font-size:13px}
.bn{display:none}.err{color:var(--d);font-size:12px}label.f{display:grid;gap:4px;font-size:12px;font-weight:600}
@keyframes in{from{opacity:0;transform:translateY(6px)}}main>*{animation:in .2s}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:820px){.lay{grid-template-columns:1fr}.days{grid-template-columns:repeat(7,1fr)}.dbtn{flex-direction:column;gap:2px;padding:8px 2px}.dl{display:none}.ds{display:inline}
.tn{display:none}.bn{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--s);border-top:1px solid var(--b);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bn button{flex:1;border:0;background:none;padding:10px 2px;font-weight:600;font-size:12px;color:var(--m);border-radius:10px;cursor:pointer}.bn .on{color:var(--p);background:var(--s2)}main{padding-bottom:90px}.hd .mu{display:none}}

.auth-wrap{min-height:100svh;display:grid;place-items:center;padding:24px}
.auth-card{width:min(100%,420px);background:var(--s);border:1px solid var(--b);border-radius:18px;padding:24px;box-shadow:0 12px 40px #00000012;display:grid;gap:14px}
.auth-card h1{font-size:22px;margin:0}.auth-card p{margin:0;color:var(--m)}
.auth-card label{display:grid;gap:6px;font-weight:600;font-size:13px}
.auth-card input{border:1px solid var(--b);background:var(--s);border-radius:9px;padding:11px;width:100%;color:var(--t)}
.auth-error{background:color-mix(in srgb,var(--d) 10%,var(--s));color:var(--d);border:1px solid color-mix(in srgb,var(--d) 30%,var(--b));padding:10px;border-radius:9px;font-size:13px}
.auth-note{font-size:12px;color:var(--m)}
</style></head><body><div id="app"></div><div id="bnr" class="bnr" hidden></div><div id="tt" class="tt" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{
const DAYS=[['lundi','Lundi'],['mardi','Mardi'],['mercredi','Mercredi'],['jeudi','Jeudi'],['vendredi','Vendredi'],['samedi','Samedi'],['dimanche','Dimanche']];
const WD=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'],TODAY=WD[new Date().getDay()];
const DL=id=>(DAYS.find(d=>d[0]===id)||[])[1]||'';
const CAT={travail:['Travail','#3b82f6'],teletravail:['Télétravail','#06b6d4'],ecole:['École / Garde','#f59e0b'],depot:['Dépôt','#0ea5e9'],recuperation:['Récupération','#f43f5e'],devoirs:['Devoirs','#a855f7'],sport:['Sport','#10b981'],repas:['Dîner','#f97316'],famille:['Famille','#ec4899'],weekend:['Week-end','#14b8a6'],coucher:['Coucher','#6366f1'],imprevu:['Imprévu','#ef4444']};
const SCHOOLS=['Aucun','Crèche','Garderie','École maternelle','École primaire','Collège','Lycée'];
const CATS0=[['gouters','Goûters & Desserts'],['feculents','Féculents'],['laitiers','Produits laitiers'],['fruits','Fruits & Légumineuses'],['conserves','Conserves'],['graines','Graines & Oléagineux'],['legumes','Légumes'],['gras','Matières grasses']].map(([id,label])=>({id,label}));
const pad=n=>String(n).padStart(2,'0');
const add=(t,m)=>{if(!t)return'00:00';const[h,i]=t.split(':').map(Number);const x=(((h*60+i+m)%1440)+1440)%1440;return pad(Math.floor(x/60))+':'+pad(x%60)};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const per=f=>Object.fromEntries(DAYS.map(d=>[d[0],f(d[0])]));
const work=(off,tele)=>per(d=>({active:!off.includes(d),start:'09:00',end:'17:30',telework:tele.includes(d)}));
const DEF={status:'couple',hasChildren:true,
adults:[{id:'adult1',firstName:'Thomas',lastName:'Martin',profession:'Chef de projet IT',color:'#2563eb',workSchedule:work(['samedi','dimanche'],['mardi','jeudi'])},{id:'adult2',firstName:'Claire',lastName:'Martin',profession:'Architecte d’intérieur',color:'#db2777',workSchedule:work(['mercredi','samedi','dimanche'],['lundi','vendredi'])}],
children:[{id:'child1',firstName:'Léo',lastName:'Martin',schoolType:'École primaire',bedtime:'20:30',schedule:per(d=>({active:!['mercredi','samedi','dimanche'].includes(d),start:'08:30',end:'16:30',garderie:['lundi','jeudi'].includes(d),garderieEnd:'17:30',dropoffBy:'adult1',pickupBy:'adult2'}))}],
routines:{homework:per(d=>({active:['lundi','mardi','jeudi'].includes(d),start:'17:45',end:'18:15',assignedTo:'adult2'})),dinnerTime:'19:30',parentsBedtime:'22:45',familyTime:{start:'20:00',end:'20:30',label:'Lecture & temps calme en famille'},entertainmentTime:{start:'20:45',end:'22:00',label:'Série / détente couple'},
customActivities:[{id:'a1',day:'mercredi',s:'14:30',e:'16:00',t:'Judo de Léo',m:'child1',c:'sport'},{id:'a2',day:'samedi',s:'14:00',e:'17:00',t:'Balade au parc & vélo',m:'all',c:'weekend'}]},
meals:per(()=>({lunch:'',dinner:''})),
cats:structuredClone(CATS0),shopping:[{id:'s1',cat:'fruits',name:'Fruits de saison',qty:'4 paniers',checked:false},{id:'s2',cat:'feculents',name:'Pâtes, riz, lentilles',qty:'Réserve',checked:false}],
alerts:{enabled:true,rules:[{id:'drop',label:'Avant dépôt enfant',off:15,active:true},{id:'pick',label:'Avant récupération enfant',off:20,active:true},{id:'hw',label:'Début des devoirs',off:10,active:true},{id:'din',label:'Préparation du dîner',off:15,active:true},{id:'bed',label:'Routine coucher enfants',off:15,active:true}]}};
Object.assign(DEF.meals,{lundi:{lunch:'Salade & poulet',dinner:'Pâtes bolognaise'},mardi:{lunch:'Quiche',dinner:'Colin, riz & courgettes'},vendredi:{lunch:'Dahl de lentilles',dinner:'Pizza maison'}});
const KEY='chronofoyer_data_v2';
const ok=d=>d&&d.adults&&d.adults.length&&d.children&&d.routines&&d.routines.homework&&d.shopping&&d.meals&&d.alerts;
// migration : l'ancien format utilisait memberId/title/start/end/category pour les activités
const migrate=d=>{delete d.chores;d.routines.customActivities=(d.routines.customActivities||[]).map(a=>a.t?a:{id:a.id,day:a.day,s:a.start,e:a.end,t:a.title,m:a.memberId,c:a.category});if(!Array.isArray(d.cats)){const old={frais:'Frais & Marché',epicerie:'Épicerie & Sec',surgeles:'Surgelés & Boissons',hygiene:'Hygiène & Maison'};d.cats=structuredClone(CATS0);d.shopping.forEach(i=>{if(!d.cats.some(c=>c.id===i.cat))d.cats.push({id:i.cat,label:old[i.cat]||i.cat})})}const mn=new Set(d.cats.filter(c=>c.g==='men'||c.id==='hygiene'||c.id==='entretien').map(c=>c.id));d.cats=d.cats.filter(c=>!mn.has(c.id));d.shopping=d.shopping.filter(i=>!mn.has(i.cat));return d};
const load=()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(ok(d))return migrate(d)}catch(e){}return structuredClone(DEF)};
let S=load();

// Configuration Supabase : la clé publishable peut être utilisée dans le navigateur.
// Ne jamais remplacer cette clé par une clé secret/service_role.
const SUPABASE_URL = 'https://mieqafpnkgunoyodiqqj.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_7uwxhrLc7bY_CF4CDwWufA_FZjol8pL';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});
let currentUser = null;
let cloudReady = false;
let saveQueue = Promise.resolve();
let lastCloudUpdatedAt = null;
let recoveryFlow = false;

const renderAuth = (message='', error='', mode='login') => {
  let content = '';
  if (mode === 'forgot') {
    content = `<form class="auth-card" id="forgotForm"><div class="logo">C</div>
      <div><h1>Mot de passe oublié ?</h1><p>Indiquez votre adresse e-mail pour recevoir un lien de réinitialisation.</p></div>
      ${message ? `<p class="auth-note">${esc(message)}</p>` : ''}
      ${error ? `<div class="auth-error" role="alert">${esc(error)}</div>` : ''}
      <label>Adresse e-mail<input name="email" type="email" autocomplete="email" required placeholder="vous@exemple.fr"></label>
      <button class="btn p" type="submit">Envoyer le lien</button>
      <button class="btn" type="button" data-auth-action="login">Retour à la connexion</button></form>`;
  } else if (mode === 'update') {
    content = `<form class="auth-card" id="updatePasswordForm"><div class="logo">C</div>
      <div><h1>Nouveau mot de passe</h1><p>Choisissez un nouveau mot de passe pour votre compte.</p></div>
      ${message ? `<p class="auth-note">${esc(message)}</p>` : ''}
      ${error ? `<div class="auth-error" role="alert">${esc(error)}</div>` : ''}
      <label>Nouveau mot de passe<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Confirmer le mot de passe<input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
      <button class="btn p" type="submit">Enregistrer le nouveau mot de passe</button></form>`;
  } else {
    content = `<form class="auth-card" id="loginForm"><div class="logo">C</div>
      <div><h1>ChronoFoyer</h1><p>Connectez-vous pour retrouver les données de votre foyer sur vos appareils.</p></div>
      ${message ? `<p class="auth-note">${esc(message)}</p>` : ''}
      ${error ? `<div class="auth-error" role="alert">${esc(error)}</div>` : ''}
      <label>Adresse e-mail<input name="email" type="email" autocomplete="username" required placeholder="vous@exemple.fr"></label>
      <label>Mot de passe<input name="password" type="password" autocomplete="current-password" required placeholder="Votre mot de passe"></label>
      <button class="btn p" type="submit" id="loginButton">Se connecter</button>
      <button class="btn g" type="button" data-auth-action="forgot">Mot de passe oublié ?</button>
      <p class="auth-note">Utilisez le compte créé dans Supabase Authentication. Aucun nouvel utilisateur ne peut s'inscrire depuis cet écran.</p></form>`;
  }
  $('#app').innerHTML = `<div class="auth-wrap">${content}</div>`;
};

const renderLoading = (message='Chargement de vos données…') => {
  $('#app').innerHTML = `<div class="auth-wrap"><div class="auth-card"><div class="logo">C</div><h1>ChronoFoyer</h1><p>${esc(message)}</p></div></div>`;
};

const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { console.error('Erreur de sauvegarde locale', e); }
  if (!currentUser || !cloudReady) return;
  const snapshot = JSON.stringify(S);
  const userId = currentUser.id;
  saveQueue = saveQueue.then(async () => {
    if (!currentUser || !cloudReady || currentUser.id !== userId) return;
    const { data, error } = await sb.from('foyer_data').upsert({
      user_id: userId,
      data: JSON.parse(snapshot),
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id' }).select('updated_at').single();
    if (error) {
      console.error('Erreur de sauvegarde Supabase', error);
      toast('Sauvegarde en ligne impossible. Vérifiez votre connexion.');
    } else if (data) {
      lastCloudUpdatedAt = data.updated_at;
    }
  }).catch(error => {
    console.error('Erreur dans la file de sauvegarde', error);
    toast('Erreur pendant la sauvegarde en ligne.');
  });
};

const activateSession = async (user) => {
  currentUser = user;
  cloudReady = false;
  renderLoading('Connexion réussie. Récupération de vos données…');
  const { data: row, error } = await sb.from('foyer_data')
    .select('data, updated_at').eq('user_id', user.id).maybeSingle();
  if (error) throw error;

  if (row) {
    if (!ok(row.data)) throw new Error('Les données en ligne ne correspondent pas au format attendu. Aucune donnée locale n’a été remplacée.');
    S = migrate(row.data);
    lastCloudUpdatedAt = row.updated_at;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { console.warn(e); }
  } else {
    // Première connexion : migration des données locales de cet appareil.
    // Si aucune sauvegarde locale valide n'existe, les données de démonstration sont initialisées.
    S = load();
    const { data: created, error: insertError } = await sb.from('foyer_data').upsert({
      user_id: user.id,
      data: S,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id' }).select('updated_at').single();
    if (insertError) throw insertError;
    lastCloudUpdatedAt = created?.updated_at || new Date().toISOString();
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { console.warn(e); }
  }
  cloudReady = true;
  draw();
};

const refreshCloud = async () => {
  if (!currentUser || !cloudReady || document.hidden) return;
  try {
    await saveQueue;
    const { data: row, error } = await sb.from('foyer_data')
      .select('data, updated_at').eq('user_id', currentUser.id).maybeSingle();
    if (error) throw error;
    if (row && row.updated_at && (!lastCloudUpdatedAt || row.updated_at > lastCloudUpdatedAt)) {
      if (!ok(row.data)) return;
      S = migrate(row.data);
      lastCloudUpdatedAt = row.updated_at;
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { console.warn(e); }
      draw();
      toast('Données du foyer actualisées');
    }
  } catch (error) { console.error('Actualisation cloud impossible', error); }
};

const signOut = async () => {
  cloudReady = false;
  const { error } = await sb.auth.signOut();
  currentUser = null;
  lastCloudUpdatedAt = null;
  if (error) renderAuth('', 'Déconnexion impossible : ' + error.message);
  else renderAuth('Vous êtes déconnecté.');
};

const bootstrap = async () => {
  renderLoading('Vérification de votre connexion…');
  try {
    const { data, error } = await sb.auth.getSession();
    if (error) throw error;
    const recoveryUrl = new URLSearchParams(window.location.hash.slice(1)).get('type') === 'recovery';
    if (recoveryFlow || recoveryUrl) { recoveryFlow = true; renderAuth('', '', 'update'); }
    else if (data.session?.user) await activateSession(data.session.user);
    else renderAuth();
  } catch (error) {
    console.error('Initialisation ChronoFoyer', error);
    currentUser = null;
    cloudReady = false;
    renderAuth('', 'Connexion à Supabase impossible : ' + (error.message || 'erreur inconnue'));
  }
};
const U={tab:'agenda',day:TODAY,view:'day',f:'all',dr:0,m:null,bk:null,ask:null};
const ad=()=>S.status==='celibataire'?[S.adults[0]]:S.adults;
const kd=()=>S.hasChildren?S.children:[];
const rs=id=>id==='all'||ad().some(a=>a.id===id)||kd().some(c=>c.id===id)?id:ad()[0].id;
const nm=id=>{id=rs(id);return id==='all'?'Tout le foyer':(ad().find(a=>a.id===id)||kd().find(c=>c.id===id)).firstName};
const col=id=>{id=rs(id);return id==='all'?'#6366f1':(ad().find(a=>a.id===id)||{color:'#d97706'}).color};
const mo=all=>[...(all?[['all','Tout le foyer']]:[]),...ad().map(a=>[a.id,a.firstName])];
// ---------- composants ----------
const fld=(p,v,x='')=>`<input class="in" data-p="${p}" value="${esc(v)}" ${x}>`;
const tm=(p,v,dis)=>`<input class="in" type="time" data-p="${p}" value="${esc(v)}" ${dis?'disabled':''}>`;
const ck=(p,v,dis,l)=>`<input type="checkbox" data-p="${p}" ${v?'checked':''} ${dis?'disabled':''} ${l?`aria-label="${esc(l)}"`:''}>`;
const sel=(p,o,v,dis,k)=>`<select class="in" data-p="${p}" ${k?'data-'+k:''} ${dis?'disabled':''}>${o.map(([a,l])=>`<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
const seg=(a,cur,it)=>`<div class="seg">${it.map(([v,l])=>`<button class="btn ${cur===v?'on':''}" data-a="${a}" data-v="${v}">${l}</button>`).join('')}</div>`;
const lab=(l,c)=>`<label class="f">${l}${c}</label>`;
// ---------- logique métier ----------
const events=d=>{const ev=[],R=S.routines;
 ad().forEach(a=>{const s=a.workSchedule[d];if(s&&s.active)ev.push({id:'w'+a.id,s:s.start,e:s.end,t:(s.telework?'Télétravail : ':'Travail : ')+a.firstName,u:[a.profession,s.telework?'À la maison':'Sur site'].filter(Boolean).join(' · '),m:a.id,c:s.telework?'teletravail':'travail',x:1})});
 kd().forEach(c=>{const s=c.schedule[d];

const head=()=>{const T=[['agenda','Agenda'],['planning','Planning'],['menus','Menu'],['courses','Courses'],['foyer','Foyer']],n=alertsFor(U.day).filter(a=>!(U.seen||{})[a.id]).length;
 return `<header class="hd"><div class="w row sp"><div class="row"><div class="logo">C</div><div><b style="font-size:16px">ChronoFoyer</b><div class="mu sm">${ad().map(a=>esc(a.firstName)).join(' & ')}${kd().length?` · ${kd().length} enfant${kd().length>1?'s':''}`:''}</div></div></div>
 <nav class="tn seg">${T.map(([v,l])=>`<button class="btn ${U.tab===v?'on':''}" data-a="tab" data-v="${v}">${l}</button>`).join('')}</nav>
 <div class="row"><button class="btn r" data-a="drawer">Alertes${n?`<span class="bd">${n}</span>`:''}</button><button class="btn p" data-a="open">+ Imprévu</button><button class="btn" data-a="logout">Déconnexion</button></div></div></header>`};
const bnav=()=>`<nav class="bn">${[['agenda','Agenda'],['planning','Planning'],['menus','Menu'],['courses','Courses'],['foyer','Foyer']].map(([v,l])=>`<button class="${U.tab===v?'on':''}" data-a="tab" data-v="${v}">${l}</button>`).join('')}</nav>`;
const draw=()=>{const y=scrollY,ids=['all',...ad().map(a=>a.id),...kd().map(c=>c.id)];if(!ids.includes(U.f))U.f='all';
 $('#app').innerHTML=head()+`<main class="w">${({agenda,planning,menus,courses,foyer})[U.tab]()}</main>`+bnav()+(U.dr?drawer():'')+(U.m?modal():'')+(U.bk!=null?backup():'')+(U.ask?conf():'');scrollTo(0,y)};
// ---------- notifications ----------
let tt,bt;
const toast=m=>{const t=$('#tt');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)};
const banner=a=>{const b=$('#bnr');b.innerHTML=`<div class="row sp" style="flex-wrap:nowrap;align-items:flex-start"><div><div class="sm" style="opacity:.7">ChronoFoyer · ${esc(a.t)}</div><b>${esc(a.title)}</b><div class="sm" style="opacity:.8">${esc(a.d)}</div></div><button class="btn g" style="color:#fff" data-a="closeb" aria-label="Fermer">✕</button></div>`;b.hidden=false;clearTimeout(bt);bt=setTimeout(()=>b.hidden=true,10000)};
const ring=a=>{banner(a);try{if('Notification' in window&&Notification.permission==='granted')new Notification('ChronoFoyer · '+a.title,{body:a.d})}catch(e){}};
const fired=new Set();
setInterval(()=>{if(!S.alerts.enabled)return;const n=new Date(),t=pad(n.getHours())+':'+pad(n.getMinutes()),k=n.toDateString();alertsFor(WD[n.getDay()]).filter(a=>a.t===t&&!fired.has(k+a.id)).forEach(a=>{fired.add(k+a.id);ring(a)})},15000);
// ---------- actions ----------
const close=()=>{U.dr=0;U.m=null;U.bk=null;U.ask=null};
const ask=(msg,fn)=>{U.ask={msg,fn}};
const newKid=n=>Object.assign(structuredClone(DEF.children[0]),{id:'child-'+Date.now(),firstName:'Enfant '+n,lastName:S.adults[0].lastName});
const A={tab:v=>{U.tab=v;scrollTo(0,0)},day:v=>{U.day=v},view:v=>{U.view=v},filter:v=>{U.f=v},go:v=>{U.day=v;U.view='day'},
 swap:v=>{const[i,f]=v.split(':'),s=S.children[i].schedule[U.day];s[f]=rs(s[f])==='adult1'?'adult2':'adult1';save();toast('Parent échangé')},
 open:v=>{U.m={day:U.day,s:'17:30',e:'18:30',t:'',m:'all',c:v||'imprevu'};if(v==='sport'){U.m.day='samedi';U.m.s='10:00';U.m.e='12:00'}},
 close,bd:(v,t,e)=>{if(e.target!==t)return 1;close()},
 delEv:id=>ask('Supprimer ce créneau ?',()=>{S.routines.customActivities=S.routines.customActivities.filter(a=>a.id!==id);save();toast('Créneau supprimé')}),
 delShop:id=>{S.shopping=S.shopping.filter(c=>c.id!==id);save()},
 delCat:id=>{const n=S.shopping.filter(i=>i.cat===id).length,rm=()=>{S.cats=S.cats.filter(c=>c.id!==id);S.shopping=S.shopping.filter(i=>i.cat!==id);save();toast('Catégorie supprimée')};n?ask('Supprimer cette catégorie et ses '+n+' article'+(n>1?'s':'')+' ?',rm):rm()},
 clearShop:()=>{S.shopping=S.shopping.filter(i=>!i.checked);save();toast('Articles retirés')},
 status:v=>{S.status=v;save()},kids:v=>{S.hasChildren=v==='true';if(S.hasChildren&&!S.children.length)S.children=[newKid(1)];save()},
 addKid:()=>{S.children.push(newKid(S.children.length+1));save();toast('Enfant ajouté')},
 delKid:i=>ask('Retirer '+S.children[i].firstName+' et son planning ?',()=>{S.children.splice(i,1);save();toast('Enfant retiré')}),
 reset:()=>ask('Remplacer toutes vos données par la démo ?',()=>{S=structuredClone(DEF);save();toast('Démo restaurée')}),
 bk:()=>{U.bk=JSON.stringify(S,null,1)},
 copy:()=>{const j=$('[name=j]').value;navigator.clipboard.writeText(j).then(()=>toast('Copié'),()=>toast('Copie impossible : sélectionnez le texte'));return 1},
 drawer:()=>{U.dr=1},logout:()=>{signOut();return 1},closeb:()=>{$('#bnr').hidden=true;return 1},
 notif:()=>{try{Notification.requestPermission().then(draw)}catch(e){}return 1},
 test:()=>{ring({t:'Test',title:'Test de notification',d:'Vos alertes fonctionnent.'});return 1},
 sim:id=>{const a=alertsFor(U.day).find(x=>x.id===id);if(a){banner(a);(U.seen=U.seen||{})[id]=1}},
 yes:()=>{const f=U.ask.fn;U.ask=null;f()}};
const F={shop:f=>{const n=String(f.get('item')).trim();if(!n)return;S.shopping.push({id:'s'+Date.now(),cat:f.get('cat'),name:n,qty:String(f.get('qty')).trim(),checked:false});save()},
 cat:f=>{const l=String(f.get('label')).trim();if(!l)return;if(S.cats.some(c=>c.label.toLowerCase()===l.toLowerCase())){toast('Cette catégorie existe déjà');return}S.cats.push({id:'k'+Date.now(),label:l});save();toast('Catégorie ajoutée')},
 ev:f=>{const m={day:f.get('day'),s:f.get('s'),e:f.get('e'),t:String(f.get('t')).trim(),m:f.get('m'),c:f.get('c')};
  if(!m.t){U.m={...m,err:'Indiquez un titre.'};return}
  if(m.e<=m.s){U.m={...m,err:'L’heure de fin doit être après l’heure de début.'};return}
  S.routines.customActivities.push({id:'x'+Date.now(),...m});U.m=null;U.day=m.day;U.tab=U.tab==='planning'?'planning':'agenda';U.view='day';save();toast('Agenda mis à jour')},
 import:f=>{try{const d=JSON.parse(f.get('j'));if(!ok(d))throw 0;S=migrate(d);save();close();toast('Données importées')}catch(e){toast('Import impossible : sauvegarde invalide')}}};
const setP=(p,v)=>{const k=p.split('.');let o=S;while(k.length>1)o=o[k.shift()];o[k[0]]=v};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const r=A[t.dataset.a](t.dataset.v,t,e);if(r!==1)draw()});
document.addEventListener('click', e => {
  const action = e.target.closest('[data-auth-action]')?.dataset.authAction;
  if (action === 'forgot') renderAuth('', '', 'forgot');
  if (action === 'login') renderAuth('', '', 'login');
});

document.addEventListener('submit', async e => {
  const form = e.target;
  if (!['loginForm', 'forgotForm', 'updatePasswordForm'].includes(form.id)) return;
  e.preventDefault();
  const values = new FormData(form);
  const button = form.querySelector('button[type="submit"]');
  if (button) button.disabled = true;
  try {
    if (form.id === 'loginForm') {
      button.textContent = 'Connexion…';
      const { data, error } = await sb.auth.signInWithPassword({
        email: String(values.get('email') || '').trim(),
        password: String(values.get('password') || '')
      });
      if (error) throw error;
      if (!data.user) throw new Error('Utilisateur introuvable.');
      await activateSession(data.user);
    } else if (form.id === 'forgotForm') {
      button.textContent = 'Envoi…';
      const redirectTo = window.location.origin + window.location.pathname;
      const { error } = await sb.auth.resetPasswordForEmail(
        String(values.get('email') || '').trim(), { redirectTo }
      );
      if (error) throw error;
      renderAuth('Si cette adresse correspond à un compte, un e-mail de réinitialisation va être envoyé.', '', 'forgot');
    } else {
      const password = String(values.get('password') || '');
      if (password.length < 8) throw new Error('Le mot de passe doit contenir au moins 8 caractères.');
      if (password !== String(values.get('confirmPassword') || '')) throw new Error('Les deux mots de passe ne correspondent pas.');
      button.textContent = 'Enregistrement…';
      const { error } = await sb.auth.updateUser({ password });
      if (error) throw error;
      recoveryFlow = false;
      await sb.auth.signOut();
      window.history.replaceState({}, document.title, window.location.pathname);
      renderAuth('Mot de passe modifié. Vous pouvez maintenant vous connecter.');
    }
  } catch (error) {
    console.error('Authentification ChronoFoyer', error);
    const mode = form.id === 'forgotForm' ? 'forgot' : form.id === 'updatePasswordForm' ? 'update' : 'login';
    renderAuth('', error.message || 'Une erreur est survenue. Réessayez.', mode);
  }
});

document.addEventListener('submit',e=>{const n=e.target.dataset.f;if(!n)return;e.preventDefault();F[n](new FormData(e.target));draw()});
document.addEventListener('change',e=>{const t=e.target.closest('[data-p]');if(!t)return;
 const v=t.type==='checkbox'?t.checked:t.hasAttribute('data-n')?+t.value:t.hasAttribute('data-b')?t.value==='true':t.value;
 setP(t.dataset.p,v);save();if(t.type==='checkbox'||t.tagName==='SELECT'||t.dataset.r)draw()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(U.dr||U.m||U.bk!=null||U.ask)){close();draw()}});
window.addEventListener('focus', refreshCloud);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshCloud(); });
sb.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    recoveryFlow = true;
    renderAuth('', '', 'update');
  }
});
bootstrap();
})();
</script></body></html>
